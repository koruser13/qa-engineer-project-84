---
- summary: |
    Проверка поиска товара по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites: |
    Открыта главная страница сайта
  test-data: |
    Ключевое слово dior
  steps:
    - Вводим в поле поиска ключевое слово dior
    - Нажимаем Enter
  expected-result: |
    В каталоге отображаются товары в названии которых есть слово dior

- summary: |
    Проверка добавления товара в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины
  prerequisites: |
    Открыта главная страница сайта
  test-data: |
    Товар Dior J'adore
  steps:
    - Находим товар Dior J'adore
    - Нажимаем на кнопку добавить в корзину (Add cart)
    - Открываем корзину
  expected-result: |
    Товар появляется в корзине (Cart)
